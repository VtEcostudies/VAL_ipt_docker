# ---------------------------------------------------------------------------
# AFTER CHANGING THIS FILE, DEPLOY WITH ./06_update_ipt_docker_instance.sh
# (which pulls, then does down + up).
#
# 'docker-compose' on the 26.04 server is a shim for 'docker compose
# --compatibility' (installed by 14_install_new_server.sh), so container names
# keep the v1 form val_ipt_ipt_1 that bash_ipt.sh and habits expect.
#
# HTTPS is terminated by the HOST's nginx (nginx/ipt.conf), not by a container:
# the IPT publishes 8080 on 127.0.0.1 only. Nothing outside this machine talks
# to Tomcat directly, so there is no security-group rule for 8080 either.
# ---------------------------------------------------------------------------

services:

  ipt:
    # PINNED, not ':latest'. An upgrade converts /usr/ipt in place (resource.xml,
    # EML, vocabularies), so it must be a deliberate step: test the new version
    # against a copy of the newest backup first, then bump this tag and run
    # ./06_update_ipt_docker_instance.sh. Rolling back means restoring /usr/ipt
    # from the pre-upgrade backup, not just reverting this tag.
    # 3.0.1 -> 3.3.8 on 2026-11-23. From 3.3.x the image runs as uid 999
    # (tomcat), not root, so /usr/ipt must be owned by 999:999 -- 06 ensures it.
    image: gbif/ipt:3.3.8
    # 'always' rather than 'unless-stopped' is deliberate: 'always' also revives
    # a container that was stopped when the daemon restarted, so it fails toward
    # "service up". A deliberate 'docker-compose stop' (01_ipt_docker_down.sh)
    # is still honoured until the daemon restarts.
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /usr/ipt:/srv/ipt
    # Bound container logs so 'docker logs' keeps useful history for post-mortems
    # without filling the root volume. 3 x 20MB.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
