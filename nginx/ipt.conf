# Host nginx in front of the IPT container (Ubuntu 26.04 server, 2026-11-23).
#
# Installed by 14_install_new_server.sh as /etc/nginx/sites-available/ipt and
# enabled in place of the package's 'default' site. Replaces the jwilder
# nginx-proxy container: Ubuntu's nginx gets security fixes from
# unattended-upgrades (the container's nginx did not -- NGINX2Root), and certbot
# renews through this nginx with no downtime, so the weekly "stop the site, run
# certbot --standalone, copy certs" cycle is gone.
#
# HTTP/2 is deliberately not enabled (it is off unless 'http2 on;').
#
# default_server on both ports keeps the old nginx-proxy behaviour
# (DEFAULT_HOST=ipt.vtatlasoflife.org): any Host name reaches the IPT.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ipt.vtatlasoflife.org ipt.vtecostudies.org;
    server_tokens off;

    # certbot --nginx injects its HTTP-01 challenge location here at renewal.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name ipt.vtatlasoflife.org ipt.vtecostudies.org;
    server_tokens off;

    # One lineage covers both names (ipt.vtecostudies.org is a SAN on it).
    ssl_certificate     /etc/letsencrypt/live/ipt.vtatlasoflife.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipt.vtatlasoflife.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ipt_ssl:10m;

    # Resource uploads (source files, DwC-A imports) go through the IPT UI.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Publishing a large resource holds the request open for minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
